# Pin-profile submission endpoint.
#
# Put `limit_req_zone` in the http {} block:
#   limit_req_zone $binary_remote_addr zone=pinprofile:1m rate=10r/m;
#
# Then add this location to the server {} block that serves the site.

location = /api/pin-profile {
    limit_req zone=pinprofile burst=5 nodelay;
    client_max_body_size 8k;

    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    access_log /var/log/nginx/protoroute-pin-profile.log;
}

location = /api/pin-profile/health {
    proxy_pass http://127.0.0.1:8099/health;
    access_log off;
}
